# DefectLens AI - Binary Classifier Training Configuration
# Inherits from and overrides base.yaml settings for classification training.

_base_: "base.yaml"

project:
  name: "DefectLens AI - Classifier"
  seed: 42

data:
  image_size: 224
  batch_size: 32
  num_workers: 0
  augmentation:
    horizontal_flip: true
    vertical_flip: false
    random_rotation: 15
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.1
      hue: 0.05
    random_crop: true
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

model:
  backbone: "resnet18"
  pretrained: true
  num_classes: 2
  freeze_backbone: false
  dropout: 0.3

training:
  epochs: 50
  learning_rate: 0.0005
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  early_stopping_patience: 10
  label_smoothing: 0.1
  gradient_clip_norm: 1.0

evaluation:
  threshold: 0.5
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "auroc"

output:
  dir: "outputs/classifier"
  save_predictions: true
  save_visualizations: true
  log_interval: 10
