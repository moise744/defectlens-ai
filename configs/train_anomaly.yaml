# DefectLens AI - Anomaly Detection Training Configuration
# Inherits from and overrides base.yaml settings for anomaly detection.

_base_: "base.yaml"

project:
  name: "DefectLens AI - Anomaly Detection"
  seed: 42

data:
  image_size: 256
  batch_size: 16
  num_workers: 0
  train_split: "train"
  test_split: "test"
  augmentation:
    horizontal_flip: true
    vertical_flip: false
    random_rotation: 5
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

model:
  backbone: "wide_resnet50_2"
  pretrained: true
  method: "patchcore"
  feature_layers:
    - "layer2"
    - "layer3"
  coreset_sampling_ratio: 0.01
  num_neighbors: 9

training:
  # Anomaly detection methods like PatchCore use feature extraction
  # rather than traditional gradient-based training
  epochs: 1
  learning_rate: 0.0001
  weight_decay: 0.00001
  optimizer: "adam"
  scheduler: "none"
  early_stopping_patience: 0

evaluation:
  threshold: 0.5
  metrics:
    - "auroc"
    - "f1_score"
    - "pixel_auroc"
    - "iou"
    - "dice"
  per_category: true

inference:
  device: "auto"
  batch_size: 1

output:
  dir: "outputs/anomaly"
  save_predictions: true
  save_visualizations: true
  save_anomaly_maps: true
